<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a12">
  <title>Míster, el topo</title>
  <meta name="description" content="Juego 2D basado en Kentukis de Samanta Schweblin: sos Míster, el kentuki topo de Enzo.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="topbar">
      <div id="dayLabel" class="pill"></div>
      <div class="battery" title="Batería">
        <div id="batFill"></div>
        <span id="batText"></span>
      </div>
      <div id="water" class="pill" title="Agua en la regadera"></div>
      <button id="btnMute" class="icon" aria-label="Sonido">🔊</button>
      <button id="btnPause" class="icon" aria-label="Pausa">❚❚</button>
    </div>
    <div id="tasks">
      <button id="tasksToggle">Tareas ▾</button>
      <ul id="taskList"></ul>
    </div>
    <div id="banner" hidden></div>
    <div id="toast"></div>
  </div>

  <div id="touch" hidden>
    <div id="stickZone">
      <div id="stickBase"><div id="stickKnob"></div></div>
    </div>
    <button id="btnAction" aria-label="Acción">A</button>
  </div>

  <div id="mini" hidden>
    <div class="mini-card">
      <div class="mini-head">
        <b id="miniTitle"></b>
        <button id="miniClose" aria-label="Salir">Salir</button>
      </div>
      <canvas id="miniCanvas"></canvas>
      <p id="miniHelp"></p>
    </div>
  </div>

  <div id="overlay">
    <div id="card" class="card"></div>
  </div>

  <!-- Música de fondo (reproductor de YouTube escondido) -->
  <div id="yt-musica-caja" aria-hidden="true"><div id="yt-musica"></div></div>
  <!-- Mini reproductor: pausa, canción que suena y volumen -->
  <div id="reproductor" class="reproductor" aria-label="Música">
    <button id="btnMusica" class="btn-musica" title="Pausar / seguir la música" aria-label="Pausar o seguir la música">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" /><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
    </button>
    <div class="rep-info">
      <div id="repTitulo" class="rep-titulo"><span>Cargando…</span></div>
    </div>
    <input id="volumen" type="range" min="0" max="100" value="25" aria-label="Volumen" title="Volumen">
  </div>

  <script src="game.js"></script>
</body>
</html>
